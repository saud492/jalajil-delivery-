<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<!-- Promo v4: "A vs B" comparison reel. 20s, 1080x1920. Render: node render-pw.js ad4.html ad4_silent.mp4, then python3 ad4_audio.py -->
<style>
@font-face{font-family:"Readex Pro";font-weight:160 900;src:url(readex.woff2) format("woff2");}
:root{--teal:#0F6A66;--teal2:#0a4f4c;--deep:#062b29;--cream:#F2F0EC;--copper:#A8622C;--sand:#ECD5B3;--ink:#1D2321;--wa:#25D366;--hl:#FFD24A;--bad:#C9473B;--grey:#d9d4ca}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Readex Pro",Tahoma,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.c{left:0;right:0;text-align:center}
.dots{position:absolute;inset:-200px;background-image:radial-gradient(rgba(255,255,255,.14) 2.2px,transparent 2.6px);background-size:30px 30px}
.panel{position:absolute;left:0;right:0;height:960px;overflow:hidden}
.lbl{position:absolute;left:50%;transform:translateX(-50%);border-radius:999px;padding:14px 44px;font-size:48px;font-weight:800;white-space:nowrap}
.rd{position:absolute;inset:0;opacity:0}
.ico{position:absolute;left:390px;top:270px;width:300px;height:300px;border-radius:80px;display:flex;align-items:center;justify-content:center}
.big{position:absolute;left:0;right:0;top:620px;text-align:center;font-weight:900;font-size:120px;line-height:1.1}
.mark{position:absolute;left:770px;top:290px;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.2);opacity:0}
#vs{position:absolute;left:390px;top:880px;width:300px;height:160px;border-radius:80px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.tick{width:64px;height:64px;border-radius:50%;border:5px solid rgba(255,255,255,.45);display:inline-flex;align-items:center;justify-content:center;margin:0 10px}
.btn{border-radius:40px;background:var(--wa);color:#fff;font-weight:800;font-size:58px;text-align:center;padding:40px 0;position:relative;overflow:hidden}
.chip{display:inline-block;border-radius:999px;padding:16px 36px;background:#fff;font-size:44px;font-weight:700;color:var(--teal);margin:0 8px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
svg{overflow:visible}
</style></head><body><div id="stage">

<!-- 1 HOOK: text is on screen from frame 0 -->
<div class="abs" id="s1" style="inset:0;background:var(--cream)">
  <div class="abs c" id="h0" style="top:620px;font-size:150px;font-weight:900;line-height:1.15">لا تطلع<br><span style="color:var(--copper)">للبقالة</span></div>
  <div class="abs c" id="h1" style="top:1020px;font-size:72px;font-weight:800;opacity:0">قبل تشوف هذي المقارنة</div>
  <svg class="abs" style="left:250px;top:1120px" width="580" height="50"><path id="h-ul" d="M10 25 C 160 6, 340 44, 570 18" fill="none" stroke="var(--hl)" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
</div>

<!-- 2 VERSUS -->
<div class="abs" id="s2" style="inset:0;display:none">
  <div class="panel" id="pa" style="top:0;background:var(--grey)">
    <div class="lbl" style="top:120px;background:#fff;color:#6b6459">تطلع بنفسك</div>
    <div id="ra"></div>
  </div>
  <div class="panel" id="pb" style="top:960px;background:radial-gradient(100% 90% at 50% 30%,#14817c,var(--teal) 55%,var(--teal2))">
    <div class="dots" style="opacity:.4"></div>
    <div class="lbl" id="lb" style="top:140px;background:var(--sand);color:var(--teal2)">تطلب من جلاجل</div>
    <div id="rb"></div>
    <div class="abs c" id="ticks" style="top:800px"></div>
  </div>
  <div id="vs"><div style="font-size:30px;font-weight:700;opacity:.6">VS</div><div id="vs-t" style="font-size:52px;font-weight:900"></div></div>
</div>

<!-- 3 PRICE PAYOFF -->
<div class="abs" id="s3" style="inset:0;display:none;background:radial-gradient(100% 70% at 50% 40%,#14817c,var(--teal) 55%,var(--teal2))">
  <div class="dots" style="opacity:.35"></div>
  <div class="abs c" id="p0" style="top:470px;color:var(--sand);font-weight:800;font-size:96px">والتوصيل؟</div>
  <div class="abs c" id="p1" style="top:660px;color:#fff;font-weight:900;font-size:230px;line-height:1.2">٨ ريال</div>
  <svg class="abs" style="left:170px;top:625px" width="740" height="400" viewBox="0 0 780 420"><path id="p-ring" d="M400 30 C 660 20, 770 120, 750 220 C 730 330, 560 400, 380 395 C 180 390, 30 330, 35 210 C 40 100, 170 30, 420 40" fill="none" stroke="var(--hl)" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
  <div class="abs c" id="p2" style="top:1110px;color:#fff;font-weight:700;font-size:64px">وسعر المحل نفسه<br><span style="color:var(--hl)">بدون أي زيادة</span></div>
</div>

<!-- 4 BRAND -->
<div class="abs" id="s4" style="inset:0;display:none;background:radial-gradient(90% 60% at 50% 40%,#14817c,var(--teal) 55%,var(--teal2))">
  <div class="dots" style="opacity:.35"></div>
  <div class="abs" id="b-shadow" style="left:440px;top:792px;width:200px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(8px);opacity:0"></div>
  <svg class="abs" id="b-pin" style="left:450px;top:580px;opacity:0;transform-origin:50% 100%" width="180" height="230" viewBox="-75 -190 150 195"><path d="M0 0C-18-34-60-70-60-110A60 60 0 0 1 60-110C60-70 18-34 0 0Z" fill="#fff"/><circle cx="0" cy="-110" r="24" fill="var(--teal)"/></svg>
  <div class="abs c" style="top:900px;overflow:hidden;height:190px"><div id="b-t1" style="font-size:136px;font-weight:900;color:#fff;line-height:190px;transform:translateY(200px)">توصيل جلاجل</div></div>
  <div class="abs" id="b-line" style="left:440px;top:1105px;width:200px;height:12px;border-radius:6px;background:var(--copper);transform:scaleX(0)"></div>
  <div class="abs c" id="b-t2" style="top:1150px;font-size:66px;font-weight:700;color:var(--sand);opacity:0">لمّة جلاجل على بابك</div>
</div>

<!-- 5 CTA -->
<div class="abs" id="s5" style="inset:0;display:none;background:radial-gradient(80% 50% at 30% 20%,#fff,var(--cream) 60%,#e6e2d9)">
  <div class="abs c" id="c-t0" style="top:360px;font-size:150px;font-weight:900">اطلب الحين</div>
  <div class="abs c" id="c-t1" style="top:570px;font-size:54px;font-weight:600;color:#555">بقالة · مطعم · كافيه · صيدلية</div>
  <div class="abs" id="c-btn" style="left:150px;right:150px;top:780px"><div class="btn">اطلب بالواتساب<div id="c-shine" style="position:absolute;top:0;bottom:0;left:-200px;width:160px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent)"></div></div></div>
  <div class="abs c" id="c-fee" style="top:1030px"><span class="chip">البيت ٨ ريال</span><span class="chip">الشاليهات والمنتزهات ١٠</span></div>
  <div class="abs c" id="c-url" style="top:1230px;font-size:60px;font-weight:800;color:var(--teal);direction:ltr">jalajil-delivery.pages.dev</div>
  <svg class="abs" style="left:250px;top:1320px" width="580" height="50"><path id="c-ul" d="M10 25 C 160 6, 340 44, 570 18" fill="none" stroke="var(--hl)" stroke-width="14" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
</div>

</div>
<script>
window.DUR = 20;
const $ = id => document.getElementById(id);
const cl = x => Math.max(0, Math.min(1, x));
const k = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const S = (w, inner) => `<svg width="170" height="170" viewBox="-60 -60 120 120"><g fill="none" stroke="${w}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
const IC = {
  car: c => S(c, '<path d="M-52 18V-2L-38-34H38L52-2V18Z"/><path d="M-40-4H40"/><circle cx="-30" cy="26" r="11"/><circle cx="30" cy="26" r="11"/>'),
  phone: c => S(c, '<rect x="-28" y="-50" width="56" height="100" rx="12"/><path d="M-8 36H8"/>'),
  sun: c => S(c, '<circle r="20"/><path d="M0-50V-36M0 36V50M-50 0H-36M36 0H50M-35-35L-26-26M26 26L35 35M-35 35L-26 26M26-26L35-35"/>'),
  home: c => S(c, '<path d="M-50 -5L0 -50L50 -5M-36 -16V45H36V-16"/><rect x="-11" y="15" width="22" height="30"/>'),
  ask: c => S(c, '<path d="M-22-22A22 22 0 1 1 6 0C0 4-2 10-2 18"/><circle cx="-2" cy="40" r="3"/>'),
  pin: c => `<svg width="140" height="180" viewBox="-60 -170 120 175"><path d="M0 0C-18-34-60-70-60-110A60 60 0 0 1 60-110C60-70 18-34 0 0Z" fill="${c}"/><circle cx="0" cy="-110" r="24" fill="var(--teal)"/></svg>`,
};
const X = `<svg width="80" height="80" viewBox="-40 -40 80 80"><path d="M-24-24L24 24M24-24L-24 24" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>`;
const V = (s = 84) => `<svg width="${s}" height="${s}" viewBox="-40 -40 80 80"><path d="M-26 2L-8 20L28-20" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// three rounds, one short phrase per side
const R = [
  { t: 'المشوار',  a: ['car', 'تلبس وتطلع'], b: ['phone', 'تطلب من مكانك'] },
  { t: 'الطريق',   a: ['sun', 'حر وزحمة'],   b: ['home',  'يوصل لبابك'] },
  { t: 'الانتظار', a: ['ask', 'وينه؟'],      b: ['pin',   'تشوفه بالخريطة'] },
];
const R0 = 2.2, RL = 2.8;
// Sound cues: the ONE timeline both the picture (below) and ad4_audio.py read. [time of the visible hit, sound, gain]
window.CUES = [
  [0.0, 'hit', .55],                                   // hook headline punches in
  [1.95, 'swoosh', .45],                               // split screen slides in
  ...R.flatMap((_, i) => {
    const u = R0 + i * RL;
    return [[u + 1.1, 'boop', .5], [u + 1.5, 'ding', .55]].concat(i < R.length - 1 ? [[u + 2.65, 'swoosh', .28]] : []);
  }),
  [10.75, 'swoosh', .45],                              // green half takes over
  [11.4, 'cash', .8],                                  // "8 riyal" pops
  [13.45, 'swoosh', .25],                              // circle wipe to logo
  [13.85, 'dart', .5],                                 // pin lands
  [15.9, 'hit', .4],                                   // "order now" pops
  [17.4, 'keys', .3],                                  // link appears
  [18.3, 'button', .55],                               // shine runs across the WhatsApp button
];
R.forEach((r, i) => ['a', 'b'].forEach(side => {
  const top = side === 'a', [ic, big] = r[side], d = document.createElement('div');
  d.className = 'rd'; d.id = side + i;
  d.innerHTML = `<div class="ico" style="background:${top ? '#fff' : 'rgba(255,255,255,.12)'}">${IC[ic](top ? '#8a8276' : '#fff')}</div>
    <div class="big" style="color:${top ? '#5a544b' : '#fff'}">${big}</div>
    <div class="mark" id="${side}m${i}" style="background:${top ? 'var(--bad)' : 'var(--wa)'}">${top ? X : V()}</div>`;
  $(top ? 'ra' : 'rb').appendChild(d);
}));
$('ticks').innerHTML = R.map((_, i) => `<span class="tick" id="tk${i}"><span id="tv${i}" style="opacity:0;display:inline-flex">${V(36)}</span></span>`).join('');

const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };

window.frame = t => {
  // 1 hook 0 - 2.2 (visible at t=0, small punch so it is never static)
  show('s1', t < 2.25);
  if (t < 2.25) {
    const pz = 1.12 - .12 * eo(k(t, 0, .35)); $('h0').style.transform = `scale(${pz})`;
    const p1 = eo(k(t, .55, .9)); $('h1').style.opacity = p1; $('h1').style.transform = `translateY(${(1 - p1) * 40}px)`;
    $('h-ul').style.strokeDashoffset = 1 - eo(k(t, .9, 1.3));
  }
  // 2 versus 1.7 - 11.0
  const on2 = t >= 1.7 && t < 11.0; show('s2', on2);
  if (on2) {
    const pin = eo(k(t, 1.7, 2.15)), out = eio(k(t, 10.5, 11.0));
    $('pa').style.transform = `translateY(${-(1 - pin) * 960 - out * 960}px)`;
    $('pb').style.transform = `translateY(${(1 - pin) * 960}px)`;
    $('pb').style.top = (960 - out * 960) + 'px'; $('pb').style.height = (960 + out * 960) + 'px';
    $('vs').style.transform = `scale(${back(k(t, 2.0, 2.35)) * (1 - k(t, 10.3, 10.5))})`;
    R.forEach((r, i) => {
      const u = t - (R0 + i * RL), last = i === R.length - 1;
      const inA = eo(k(u, .1, .4)), inB = eo(k(u, .45, .75)), o = last ? eio(k(t, 10.2, 10.5)) : eio(k(u, 2.5, 2.8));
      const A = $('a' + i), B = $('b' + i);
      A.style.opacity = inA * (1 - o); B.style.opacity = inB * (1 - o);
      A.style.transform = `translateX(${(1 - inA) * 140 - o * 140}px)`;
      B.style.transform = `translateX(${-(1 - inB) * 140 + o * 140}px)`;
      const mA = back(k(u, 1.1, 1.35)), mB = back(k(u, 1.5, 1.75));
      $('am' + i).style.opacity = k(u, 1.1, 1.2); $('am' + i).style.transform = `scale(${mA}) rotate(${(1 - mA) * -40}deg)`;
      $('bm' + i).style.opacity = k(u, 1.5, 1.6); $('bm' + i).style.transform = `scale(${mB})`;
      A.style.filter = `grayscale(${k(u, 1.15, 1.5)}) opacity(${1 - .35 * k(u, 1.15, 1.5)})`;
      const tv = back(k(u, 1.6, 1.85)); $('tv' + i).style.opacity = k(u, 1.6, 1.7); $('tv' + i).style.transform = `scale(${tv})`;
      $('tk' + i).style.background = u >= 1.6 ? 'var(--wa)' : 'transparent'; $('tk' + i).style.borderColor = u >= 1.6 ? 'var(--wa)' : 'rgba(255,255,255,.45)';
      if (u >= -.15 && u < RL - .15) $('vs-t').textContent = r.t;
    });
    const sh = R.reduce((s, _, i) => { const u = t - (R0 + i * RL) - 1.1; return s + (u > 0 && u < .25 ? Math.sin(u * 90) * (1 - u / .25) * 10 : 0); }, 0);
    $('ra').style.transform = `translateX(${sh}px)`;
    $('ticks').style.opacity = 1 - k(t, 10.2, 10.4);
  }
  // 3 price 10.9 - 13.6
  const on3 = t >= 10.9 && t < 13.6; show('s3', on3);
  if (on3) {
    const a = eo(k(t, 11.0, 11.3)); $('p0').style.opacity = a; $('p0').style.transform = `translateY(${(1 - a) * 40}px)`;
    const b = back(k(t, 11.4, 11.75)); $('p1').style.opacity = k(t, 11.4, 11.5); $('p1').style.transform = `scale(${b})`;
    $('p-ring').style.strokeDashoffset = 1 - eio(k(t, 11.8, 12.3));
    const c = eo(k(t, 12.2, 12.55)); $('p2').style.opacity = c; $('p2').style.transform = `translateY(${(1 - c) * 40}px)`;
    $('s3').style.clipPath = `circle(${(1 - eio(k(t, 13.3, 13.6))) * 150}% at 50% 40%)`; $('s3').style.zIndex = 2;
  }
  // 4 brand 13.3 - 16.0
  const on4 = t >= 13.3 && t < 16.0; show('s4', on4);
  if (on4) {
    const drop = k(t, 13.45, 13.85), sq = t > 13.85 ? Math.exp(-(t - 13.85) * 9) * Math.sin((t - 13.85) * 30) * .12 : 0;
    $('b-pin').style.opacity = drop > 0 ? 1 : 0;
    $('b-pin').style.transform = `translateY(${drop < 1 ? -500 * (1 - eo(drop)) : 0}px) scale(${1 + sq},${1 - sq})`;
    $('b-shadow').style.opacity = drop > 0 ? .3 + .7 * eo(drop) : 0;
    $('b-t1').style.transform = `translateY(${(1 - eo(k(t, 13.9, 14.3))) * 200}px)`;
    $('b-line').style.transform = `scaleX(${eo(k(t, 14.2, 14.55))})`;
    const t2 = eo(k(t, 14.4, 14.8)); $('b-t2').style.opacity = t2; $('b-t2').style.transform = `translateY(${(1 - t2) * 30}px)`;
    $('s4').style.clipPath = `circle(${(1 - eio(k(t, 15.7, 16.0))) * 150}% at 50% 40%)`; $('s4').style.zIndex = 2;
  }
  // 5 CTA 15.7 - 20
  const on5 = t >= 15.7; show('s5', on5);
  if (on5) {
    const f = (id, a, dy = 50) => { const p = eo(k(t, a, a + .35)); $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * dy}px)`; };
    $('c-t0').style.opacity = k(t, 15.9, 16.0); $('c-t0').style.transform = `scale(${.6 + .4 * back(k(t, 15.9, 16.25))})`;
    f('c-t1', 16.25); f('c-btn', 16.6, 80); f('c-fee', 17.0); f('c-url', 17.4);
    $('c-ul').style.strokeDashoffset = 1 - eo(k(t, 17.8, 18.2));
    $('c-shine').style.left = (-200 + 1100 * eio(k(t, 18.3, 19.1))) + 'px';
    if (t > 17) $('c-btn').style.transform += ` scale(${1 + .025 * Math.sin((t - 17) * 6)})`;
  }
};
window.ready = async () => { await document.fonts.load('900 100px "Readex Pro"'); };
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { window.frame(((performance.now() - t0) / 1000) % window.DUR); requestAnimationFrame(loop); })(); }
</script></body></html>
