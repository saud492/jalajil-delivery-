<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<!-- Promo v4: "A vs B" comparison reel. 24s, 1080x1920. Render: node render-pw.js ad4.html ad4.mp4 -->
<style>
@font-face{font-family:"Readex Pro";font-weight:160 900;src:url(readex.woff2) format("woff2");}
:root{--teal:#0F6A66;--teal2:#0a4f4c;--deep:#062b29;--cream:#F2F0EC;--copper:#A8622C;--sand:#ECD5B3;--ink:#1D2321;--wa:#25D366;--hl:#FFD24A;--bad:#C9473B;--grey:#d9d4ca}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Readex Pro",Tahoma,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.c{left:0;right:0;text-align:center}
.mask{display:block;overflow:hidden}
.w{display:block;font-weight:900;will-change:transform,opacity}
.dots{position:absolute;inset:-200px;background-image:radial-gradient(rgba(255,255,255,.14) 2.2px,transparent 2.6px);background-size:30px 30px}
.panel{position:absolute;left:0;right:0;height:960px;overflow:hidden}
.lbl{position:absolute;left:50%;transform:translateX(-50%);border-radius:999px;padding:14px 44px;font-size:46px;font-weight:800;white-space:nowrap}
.rd{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0}
.ico{position:absolute;left:390px;width:300px;height:300px;border-radius:80px;display:flex;align-items:center;justify-content:center}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:124px;line-height:1.1}
.small{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:46px}
.mark{position:absolute;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.2)}
#vs{position:absolute;left:390px;top:880px;width:300px;height:160px;border-radius:80px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.btn{border-radius:40px;background:var(--wa);color:#fff;font-weight:800;font-size:58px;text-align:center;padding:40px 0;position:relative;overflow:hidden}
.chip{display:inline-block;border-radius:999px;padding:16px 36px;background:#fff;font-size:44px;font-weight:700;color:var(--teal);margin:0 8px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
svg{overflow:visible}
</style></head><body><div id="stage">

<!-- 1 HOOK -->
<div class="abs" id="s1" style="inset:0;background:var(--cream)">
  <div class="abs c" style="top:610px">
    <span class="mask" style="padding:20px 0 30px;margin:-20px 0 -40px"><span class="w" id="h0" style="font-size:130px">نفس المقاضي</span></span>
    <span class="mask" style="padding:20px 0 30px;margin:-20px 0 -40px"><span class="w" id="h1" style="font-size:130px">نفس المحل</span></span>
    <span class="mask" style="padding:20px 0 40px;margin:0"><span class="w" id="h2" style="font-size:190px;color:var(--copper)">طريقتين</span></span>
  </div>
  <svg class="abs" style="left:270px;top:1250px" width="540" height="60"><path id="h-ul" d="M10 30 C 140 8, 300 52, 530 22" fill="none" stroke="var(--hl)" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
</div>

<!-- 2 VERSUS -->
<div class="abs" id="s2" style="inset:0;display:none">
  <div class="panel" id="pa" style="top:0;background:var(--grey)">
    <div class="lbl" style="top:110px;background:#fff;color:#6b6459">تطلع بنفسك</div>
    <div id="ra"></div>
  </div>
  <div class="panel" id="pb" style="top:960px;background:radial-gradient(100% 90% at 50% 30%,#14817c,var(--teal) 55%,var(--teal2))">
    <div class="dots" style="opacity:.4"></div>
    <div class="lbl" id="lb" style="top:110px;background:var(--sand);color:var(--teal2)">مع توصيل جلاجل</div>
    <div id="rb"></div>
    <div class="abs" id="score" style="left:50%;transform:translateX(-50%);top:830px;font-size:44px;font-weight:800;color:var(--teal2);background:var(--hl);border-radius:999px;padding:10px 36px;white-space:nowrap;display:none"></div>
  </div>
  <div id="vs"><div style="font-size:30px;font-weight:700;opacity:.6">VS</div><div id="vs-t" style="font-size:52px;font-weight:900">الوقت</div></div>
</div>

<!-- 3 WINNER + BRAND -->
<div class="abs" id="s3" style="inset:0;display:none;background:radial-gradient(90% 60% at 50% 40%,#14817c,var(--teal) 55%,var(--teal2))">
  <div class="dots" style="opacity:.35"></div>
  <div class="abs c" id="w-score" style="top:560px;color:#fff;font-weight:900;font-size:260px">٤ – ٠</div>
  <div class="abs c" id="w-t" style="top:900px;color:var(--sand);font-weight:800;font-size:84px">والفايز واضح</div>
  <div class="abs" id="b-shadow" style="left:440px;top:792px;width:200px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(8px);opacity:0"></div>
  <svg class="abs" id="b-pin" style="left:450px;top:580px;opacity:0" width="180" height="230" viewBox="-75 -190 150 195"><path d="M0 0C-18-34-60-70-60-110A60 60 0 0 1 60-110C60-70 18-34 0 0Z" fill="#fff"/><circle cx="0" cy="-110" r="24" fill="var(--teal)"/></svg>
  <div class="abs c" style="top:900px;overflow:hidden;height:190px"><div id="b-t1" style="font-size:136px;font-weight:900;color:#fff;line-height:190px;transform:translateY(200px)">توصيل جلاجل</div></div>
  <div class="abs" id="b-line" style="left:440px;top:1105px;width:200px;height:12px;border-radius:6px;background:var(--copper);transform:scaleX(0)"></div>
  <div class="abs c" id="b-t2" style="top:1150px;font-size:66px;font-weight:700;color:var(--sand);opacity:0">لمّة جلاجل على بابك</div>
</div>

<!-- 4 CTA -->
<div class="abs" id="s4" style="inset:0;display:none;background:radial-gradient(80% 50% at 30% 20%,#fff,var(--cream) 60%,#e6e2d9)">
  <div class="abs c" id="c-t0" style="top:330px;font-size:150px;font-weight:900">اطلب الحين</div>
  <div class="abs c" id="c-t1" style="top:540px;font-size:54px;font-weight:600;color:#555">بقالة · مطعم · كافيه · صيدلية</div>
  <div class="abs" id="c-btn" style="left:150px;right:150px;top:760px"><div class="btn">اطلب بالواتساب<div id="c-shine" style="position:absolute;top:0;bottom:0;left:-200px;width:160px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent)"></div></div></div>
  <div class="abs c" id="c-fee" style="top:1010px"><span class="chip">البيت ٨ ريال</span><span class="chip">الشاليهات والمنتزهات ١٠</span></div>
  <div class="abs c" id="c-url" style="top:1220px;font-size:60px;font-weight:800;color:var(--teal);direction:ltr">jalajil-delivery.pages.dev</div>
  <svg class="abs" style="left:250px;top:1310px" width="580" height="50"><path id="c-ul" d="M10 25 C 160 6, 340 44, 570 18" fill="none" stroke="var(--hl)" stroke-width="14" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
  <div class="abs c" id="c-tag" style="top:1500px;font-size:62px;font-weight:800;color:var(--copper)">وخلّك مرتاح</div>
</div>

</div>
<script>
window.DUR = 24;
const $ = id => document.getElementById(id);
const cl = x => Math.max(0, Math.min(1, x));
const k = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

// ---- icons (simple vector line art) ----
const S = (w, inner) => `<svg width="170" height="170" viewBox="-60 -60 120 120"><g fill="none" stroke="${w}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
const IC = {
  clock: c => S(c, '<circle r="48"/><path d="M0 -28V0L20 14"/>'),
  phone: c => S(c, '<rect x="-28" y="-50" width="56" height="100" rx="12"/><path d="M-8 36H8"/>'),
  sun: c => S(c, '<circle r="20"/><path d="M0-50V-36M0 36V50M-50 0H-36M36 0H50M-35-35L-26-26M26 26L35 35M-35 35L-26 26M26-26L35-35"/>'),
  home: c => S(c, '<path d="M-50 -5L0 -50L50 -5M-36 -16V45H36V-16"/><rect x="-11" y="15" width="22" height="30"/>'),
  fuel: c => S(c, '<rect x="-40" y="-46" width="52" height="92" rx="8"/><path d="M-30-32H2V-6H-30Z"/><path d="M12-20L34-4V30A8 8 0 0 0 50 30V-10L36-26"/>'),
  tag: c => S(c, '<path d="M-46-46H0L48 2L2 48L-46 0Z"/><circle cx="-22" cy="-22" r="8"/>'),
  ask: c => S(c, '<path d="M-22-22A22 22 0 1 1 6 0C0 4-2 10-2 18"/><circle cx="-2" cy="40" r="3"/>'),
  pin: c => `<svg width="140" height="180" viewBox="-60 -170 120 175"><path d="M0 0C-18-34-60-70-60-110A60 60 0 0 1 60-110C60-70 18-34 0 0Z" fill="${c}"/><circle cx="0" cy="-110" r="24" fill="var(--teal)"/></svg>`,
};
const X = `<svg width="80" height="80" viewBox="-40 -40 80 80"><path d="M-24-24L24 24M24-24L-24 24" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>`;
const V = `<svg width="84" height="84" viewBox="-40 -40 80 80"><path d="M-26 2L-8 20L28-20" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ---- rounds ----
const R = [
  { t: 'الوقت',   a: ['clock', '٤٥ دقيقة', 'مشوار رايح جاي'],          b: ['phone', 'دقيقة', 'تطلب وأنت بمكانك'] },
  { t: 'المشوار', a: ['sun',   'حر وزحمة', 'ودوّرة على موقف'],          b: ['home',  'ولا خطوة', 'المندوب يجيب لك كل شي'] },
  { t: 'التكلفة', a: ['fuel',  'بنزين وتعب', 'ومشوار ثاني لو نسيت شي'],  b: ['tag',   '٨ ريال', 'وسعر المحل نفسه بدون زيادة'] },
  { t: 'المتابعة', a: ['ask',  'وينه؟', 'تتصل وتسأل كل شوي'],           b: ['pin',   'تتابعه مباشر', 'تشوف المندوب لين يوصلك'] },
];
const R0 = 3.0, RL = 3.0;
const mk = (side, r, i) => {
  const top = side === 'a';
  const d = document.createElement('div'); d.className = 'rd'; d.id = side + i;
  const [ic, big, small] = r[side];
  d.innerHTML = `
    <div class="ico" style="top:230px;background:${top ? '#fff' : 'rgba(255,255,255,.12)'}">${IC[ic](top ? '#8a8276' : '#fff')}</div>
    <div class="big" style="top:560px;color:${top ? '#5a544b' : '#fff'}">${big}</div>
    <div class="small" style="top:720px;color:${top ? '#7a7366' : 'var(--sand)'}">${small}</div>
    <div class="mark" id="${side}m${i}" style="left:${top ? 770 : 770}px;top:250px;background:${top ? 'var(--bad)' : 'var(--wa)'};opacity:0">${top ? X : V}</div>`;
  $(top ? 'ra' : 'rb').appendChild(d);
};
R.forEach((r, i) => { mk('a', r, i); mk('b', r, i); });

const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };

window.frame = t => {
  // ---------- scene 1: hook 0 - 3 ----------
  show('s1', t < 3.05);
  if (t < 3.05) {
    [[0, .05], [1, .65], [2, 1.3]].forEach(([i, a]) => {
      const p = eo(k(t, a, a + .45)); $('h' + i).style.transform = `translateY(${(1 - p) * 110}%)`;
    });
    const s = 1 + .04 * eio(k(t, 1.3, 2.4)); $('h2').style.transform += ` scale(${s})`;
    $('h-ul').style.strokeDashoffset = 1 - eo(k(t, 1.7, 2.2));
  }
  // ---------- scene 2: versus 2.4 - 15.6 ----------
  const on2 = t >= 2.4 && t < 15.6; show('s2', on2);
  if (on2) {
    const pin = eo(k(t, 2.4, 3.0));
    const out = eio(k(t, 15.0, 15.6));
    $('pa').style.transform = `translateY(${-(1 - pin) * 960 - out * 960}px)`;
    $('pb').style.transform = `translateY(${(1 - pin) * 960}px)`;
    $('pb').style.top = (960 - out * 960) + 'px'; $('pb').style.height = (960 + out * 960) + 'px';
    const vsIn = back(k(t, 2.8, 3.2)), vsOut = k(t, 14.9, 15.1);
    $('vs').style.transform = `scale(${vsIn * (1 - vsOut)})`;
    let wins = 0;
    R.forEach((r, i) => {
      const a0 = R0 + i * RL, u = t - a0;
      const last = i === R.length - 1;
      const inA = eo(k(u, .15, .5)), inB = eo(k(u, .5, .85)), outP = last ? eio(k(t, 14.7, 15.0)) : eio(k(u, 2.7, 3.0));
      const A = $('a' + i), B = $('b' + i);
      A.style.opacity = inA * (1 - outP); B.style.opacity = inB * (1 - outP);
      A.style.transform = `translateX(${(1 - inA) * 140 - outP * 140}px)`;
      B.style.transform = `translateX(${-(1 - inB) * 140 + outP * 140}px)`;
      const mA = back(k(u, 1.35, 1.6)), mB = back(k(u, 1.75, 2.0));
      $('am' + i).style.opacity = k(u, 1.35, 1.45); $('am' + i).style.transform = `scale(${mA}) rotate(${(1 - mA) * -40}deg)`;
      $('bm' + i).style.opacity = k(u, 1.75, 1.85); $('bm' + i).style.transform = `scale(${mB})`;
      A.style.filter = `grayscale(${k(u, 1.4, 1.8)}) opacity(${1 - .35 * k(u, 1.4, 1.8)})`;
      if (u >= 1.75) wins++;
      if (u >= -.1 && u < RL - .1) $('vs-t').textContent = r.t;
    });
    $('score').textContent = `النتيجة: جلاجل ${ar(wins)} – ٠`; $('score').style.display = wins ? 'block' : 'none';
    // tiny shake on the losing panel when the X lands
    const sh = R.reduce((s, _, i) => { const u = t - (R0 + i * RL) - 1.35; return s + (u > 0 && u < .25 ? Math.sin(u * 90) * (1 - u / .25) * 10 : 0); }, 0);
    $('ra').style.transform = `translateX(${sh}px)`;
  }
  // ---------- scene 3: winner + brand 15.0 - 19.6 ----------
  const on3 = t >= 15.5 && t < 19.6; show('s3', on3);
  if (on3) {
    const sIn = back(k(t, 15.5, 15.85)), sOut = eio(k(t, 16.9, 17.2));
    $('w-score').style.transform = `scale(${sIn * (1 - sOut)})`; $('w-score').style.opacity = 1 - sOut;
    const wIn = eo(k(t, 15.8, 16.2)); $('w-t').style.opacity = wIn * (1 - sOut); $('w-t').style.transform = `translateY(${(1 - wIn) * 40}px)`;
    const drop = k(t, 17.2, 17.65), d = drop < 1 ? -500 * (1 - eo(drop)) : 0;
    const sq = t > 17.65 ? Math.exp(-(t - 17.65) * 9) * Math.sin((t - 17.65) * 30) * .12 : 0;
    $('b-pin').style.opacity = drop > 0 ? 1 : 0;
    $('b-pin').style.transform = `translateY(${d}px) scale(${1 + sq},${1 - sq})`; $('b-pin').style.transformOrigin = '50% 100%';
    $('b-shadow').style.opacity = drop > 0 ? .3 + .7 * eo(drop) : 0;
    $('b-t1').style.transform = `translateY(${(1 - eo(k(t, 17.7, 18.15))) * 200}px)`;
    $('b-line').style.transform = `scaleX(${eo(k(t, 18.0, 18.4))})`;
    const t2 = eo(k(t, 18.2, 18.6)); $('b-t2').style.opacity = t2; $('b-t2').style.transform = `translateY(${(1 - t2) * 30}px)`;
    const outS = eio(k(t, 19.3, 19.6)); $('s3').style.clipPath = `circle(${(1 - outS) * 150}% at 50% 40%)`;
  }
  // ---------- scene 4: CTA 19.3 - 24 ----------
  const on4 = t >= 19.3; show('s4', on4); if (on4) $('s4').style.zIndex = 0;
  if (on3 && on4) $('s3').style.zIndex = 2;
  if (on4) {
    const f = (id, a, dy = 50) => { const p = eo(k(t, a, a + .4)); $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * dy}px)`; };
    const p0 = back(k(t, 19.5, 19.9)); $('c-t0').style.transform = `scale(${.6 + .4 * p0})`; $('c-t0').style.opacity = k(t, 19.5, 19.6);
    f('c-t1', 19.9); f('c-btn', 20.3, 80); f('c-fee', 20.8); f('c-url', 21.3);
    $('c-ul').style.strokeDashoffset = 1 - eo(k(t, 21.7, 22.2));
    const tg = back(k(t, 22.3, 22.7)); $('c-tag').style.opacity = k(t, 22.3, 22.4); $('c-tag').style.transform = `scale(${tg})`;
    $('c-shine').style.left = (-200 + 1100 * eio(k(t, 20.8, 21.6)) + 1100 * eio(k(t, 22.9, 23.6)) * (t > 22.9 ? 1 : 0) - (t > 22.9 ? 1100 : 0)) + 'px';
    const pulse = t > 21 ? 1 + .025 * Math.sin((t - 21) * 6) : 1; $('c-btn').style.transform += ` scale(${pulse})`;
  }
};
window.ready = async () => { await document.fonts.load('900 100px "Readex Pro"'); };
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { window.frame(((performance.now() - t0) / 1000) % window.DUR); requestAnimationFrame(loop); })(); }
</script></body></html>
