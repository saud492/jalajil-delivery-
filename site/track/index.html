<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة طلبك · توصيل جلاجل</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a4f4c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec;--surface:#fffdf9;--surface2:#f7f5f0;--ink:#1f2a2b;--muted:#5f6b6b;--line:#e2ded5;
  --accent:#0f6a66;--accent-2:#0a4f4c;--accent-ink:#ffffff;--accent-soft:#e1efed;--stone:#a4652f;--sand:#ecd5b3;
  --bad:#b3261e;--bad-soft:#fbe9e7;--new:#a4652f;--new-soft:#f8ecdc;--wa:#1f8f4e;
  --shadow:0 1px 2px rgba(31,42,43,.05),0 6px 20px rgba(31,42,43,.06);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121818;--surface:#1a2222;--surface2:#151c1c;--ink:#e9eeec;--muted:#a3b0ae;--line:#2b3636;
    --accent:#4fb8b0;--accent-2:#0f6a66;--accent-ink:#0b1414;--accent-soft:#1d3332;--stone:#d39a63;--sand:#e4c99f;
    --bad:#ff8a80;--bad-soft:#3a2220;--new:#d39a63;--new-soft:#33291f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;min-height:100vh}
.hidden{display:none !important}
h1,h2,h3{font-family:var(--font-display);margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.top{color:#fff;background:radial-gradient(120% 140% at 85% 0%,#17847e 0%,#0f6a66 45%,#0a4f4c 100%);padding:calc(16px + env(safe-area-inset-top)) 16px 18px}
.top-in{max-width:560px;margin:0 auto}
.top small{display:block;color:var(--sand);font-weight:500;font-size:13px}
.top h1{font-size:22px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:14px}
/* الخطوات */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500;padding:4px 0}
.steps li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now i{border-color:var(--new);background:var(--new-soft)}
/* الرمز */
.codebox{text-align:center;background:var(--accent-soft);box-shadow:none}
.codebox .code{font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:12px;color:var(--accent);direction:ltr;padding-left:12px;line-height:1.2}
.codebox .warn{color:var(--bad);font-weight:700;font-size:14px;margin:0}
/* الفاتورة */
.part{display:flex;flex-direction:column;gap:4px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.part:last-child{border-bottom:none;padding-bottom:0}
.part-h{display:flex;align-items:center;gap:8px}
.part-h b{flex:1;min-width:0}
.amt{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.wait{color:var(--muted);font-family:var(--font-body);font-weight:500;font-size:14px}
.items{white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:14px}
.pic{align-self:flex-start;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.x{background:var(--bad-soft);color:var(--bad)}
.tot{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--line);padding-top:10px}
.tot div{display:flex;justify-content:space-between;gap:8px}
.tot .big{font-family:var(--font-display);font-size:19px;font-weight:800}
.tot .big .amt{color:var(--accent)}
/* الإجراءات */
.act{border:2px solid var(--new)}
.act h2{font-size:18px}
.btn{border:none;border-radius:14px;padding:15px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);width:100%}
.btn.line{background:none;color:var(--bad);border:1.5px solid var(--line);font-size:15px;padding:11px}
.btn[disabled]{opacity:.5}
.payinfo{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:12px;padding:10px 12px;font-weight:600;user-select:all}
.drv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drv b{flex:1}
.drv a,.help{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 14px;font-size:14px}
.help{justify-content:center;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:14px;padding:12px}
.empty{text-align:center;padding:40px 16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;font-size:14px;max-width:90vw;text-align:center}
.imgv{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.imgv img{max-width:100%;max-height:100%;border-radius:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><small>توصيل جلاجل</small><h1 id="title">متابعة طلبك</h1></div></header>

<main class="wrap" id="main">
  <div class="card empty" id="loading">جاري تحميل طلبك…</div>
</main>

<div class="imgv hidden" id="imgv" role="dialog" aria-label="صورة"><img id="imgvImg" alt="صورة الفاتورة"></div>
<div class="toast hidden" id="toast" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" class="hidden">

<script>
const $ = s => document.querySelector(s);
const AR = "٠١٢٣٤٥٦٧٨٩";
const toAr = n => String(n).replace(/\d/g, d => AR[d]);
const money = n => toAr((Math.round((+n||0)*100)/100).toString());
const DEST = { home:"البيت", chalet:"شاليه", park:"المنتزه" };
const K = new URLSearchParams(location.search).get("k") || "";
let D = null, busy = false, lastStage = null;

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(()=>e.classList.add("hidden"), 2800); }
function myCode(){ try{ const o = JSON.parse(localStorage.getItem("jl-orders") || "[]").find(x=>x.t === K); return o ? o.c : null; }catch(e){ return null; } }

async function api(body){
  const opt = body ? {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store"};
  const r = await fetch("/api/track/" + encodeURIComponent(K), opt);
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(d.error || "صار خطأ، جرّب مرة ثانية"), {status: r.status});
  return d;
}

// تصغير الصورة بالجوال قبل الرفع
function compress(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .72, out = c.toDataURL("image/jpeg", q);
      while(out.length > 850000 && q > .3){ q -= .12; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("ما قدرنا نقرأ الصورة")); };
    img.src = url;
  });
}

const STEPS = [
  ["pricing", "المحل يجهّز ويحسب الفاتورة"],
  ["approve", "توافق على المبلغ"],
  ["prepay", "تحويل المبلغ مسبقاً"],
  ["buying", "المندوب يشتري ويستلم"],
  ["onway", "المندوب في الطريق لك"],
  ["delivered", "وصل طلبك"],
];
const ORDER = ["pricing","approve","prepay","prepay_check","buying","onway","delivered"];

function render(){
  const m = $("#main"); m.innerHTML = "";
  const o = D.order;
  $("#title").textContent = "طلب " + o.order_no;
  document.title = (D.stage === "approve" ? "⚠️ وافق على المبلغ · " : "") + "طلب " + o.order_no + " · توصيل جلاجل";

  // الرمز
  const code = myCode();
  if(D.stage !== "cancelled" && D.stage !== "delivered"){
    const c = el("section", "card codebox");
    c.append(el("div", "muted", "رمز استلام طلبك"));
    if(code){ c.append(el("div", "code", code)); c.append(el("p", "warn", "لا تعطيه للمندوب إلا بعد ما تستلم طلبك كامل.")); }
    else c.append(el("p", "muted", "الرمز محفوظ في الجوال اللي طلبت منه. لو ضاع منك، تواصل معنا من زر المساعدة تحت."));
    m.append(c);
  }

  // الإجراء المطلوب
  const a = actionCard();
  if(a) m.append(a);

  // الخطوات
  if(D.stage !== "cancelled"){
    const s = el("section", "card"); s.append(el("h2", "", "وين وصل طلبك"));
    const ul = el("ol", "steps");
    const cur = D.stage === "prepay_check" ? "prepay" : D.stage;
    const ci = ORDER.indexOf(D.stage);
    STEPS.filter(([k])=> k !== "prepay" || D.needsPrepay).forEach(([k, t])=>{
      const i = ORDER.indexOf(k);
      const li = el("li", i < ci || D.stage === "delivered" ? "done" : k === cur ? "now" : "");
      li.append(el("i", "", li.className === "done" ? "✓" : ""), t); ul.append(li);
    });
    s.append(ul);
    if(D.driver){
      const d = el("div", "drv"); d.append("🛵 ", el("b", "", "المندوب: " + D.driver.name));
      const ph = (D.driver.phone || "").replace(/[^\d+]/g, "");
      if(ph && D.stage !== "delivered"){ const x = el("a", "", "📞 اتصل"); x.href = "tel:" + ph; d.append(x); }
      s.append(d);
    }
    m.append(s);
  }

  // الفاتورة
  const b = el("section", "card"); b.append(el("h2", "", "🧾 الفاتورة"));
  D.parts.forEach(p=>{
    const r = el("div", "part"); const h = el("div", "part-h");
    h.append(el("b", "", (p.category && p.category !== p.shop_name ? p.category + " · " : "") + (p.shop_name || "محل")));
    if(p.status === "rejected") h.append(el("span", "badge x", "المحل رفض"));
    else if(p.status === "cancelled") h.append(el("span", "badge x", "ملغي"));
    else if(p.bill != null){ if(p.partner) h.append(el("span", "badge", "المبلغ من المحل")); h.append(el("span", "amt", money(p.bill) + " ر")); }
    else h.append(el("span", "amt wait", "ينحسب…"));
    r.append(h);
    if(p.items) r.append(el("div", "items", p.items));
    if(p.receipt){ const x = el("button", "pic", "📷 صورة الفاتورة"); x.onclick = () => showImg(p.receipt); r.append(x); }
    b.append(r);
  });
  const t = el("div", "tot");
  const row = (k, v, cls) => { const d = el("div", cls || ""); d.append(el("span", "", k), el("span", "amt", v)); t.append(d); };
  row("قيمة المشتريات", D.billed ? money(D.total) + " ريال" : "ينحسب…");
  row("التوصيل", money(o.fee) + " ريال");
  if(D.prepaid) row("حوّلته مسبقاً", "− " + money(D.total) + " ريال");
  if(D.billed) row(D.stage === "delivered" ? "دفعته للمندوب" : "تدفع للمندوب عند الاستلام", money(D.collect) + " ريال", "big");
  b.append(t);
  b.append(el("div", "muted", "التوصيل إلى: " + (DEST[o.dest] || o.dest) + (o.place ? " · " + o.place : "") + (o.pay ? " · الدفع: " + o.pay : "")));
  m.append(b);

  // مساعدة
  if(D.support){
    const h = el("a", "help", "💬 عندي مشكلة في الطلب");
    h.href = "https://wa.me/" + D.support + "?text=" + encodeURIComponent("مشكلة في طلب " + o.order_no + "\n" + location.href);
    h.target = "_blank"; h.rel = "noopener"; m.append(h);
  }
}

function actionCard(){
  const c = el("section", "card act");
  const st = D.stage;
  if(st === "pricing"){
    c.classList.remove("act");
    c.append(el("h2", "", "⏳ ننتظر الفاتورة"), el("p", "muted", "المحل أو المندوب بيكتب مبلغ الفاتورة، وبيطلع لك هنا عشان توافق عليه. خلّ الصفحة مفتوحة."));
    return c;
  }
  if(st === "approve"){
    c.append(el("h2", "", "وافق على مبلغ الفاتورة"));
    c.append(el("p", "muted", `قيمة المشتريات ${money(D.total)} ريال، والتوصيل ${money(D.order.fee)} ريال. المندوب ما يدفع للمحل إلا بعد موافقتك.`));
    if(D.needsPrepay) c.append(el("p", "muted", `الفاتورة فوق ${money(D.prepay_cap)} ريال، فبعد الموافقة تحوّل قيمتها مسبقاً.`));
    const ok = el("button", "btn", `✅ موافق على ${money(D.total)} ريال`); ok.onclick = () => send({action:"approve", total: D.total}, "تمام، وافقت ✓");
    const no = el("button", "btn line", "ما أبي، ألغِ الطلب"); no.onclick = () => { if(confirm("أكيد تبي تلغي الطلب كامل؟")) send({action:"reject"}, "انلغى الطلب"); };
    c.append(ok, no); return c;
  }
  if(st === "prepay"){
    c.append(el("h2", "", `💳 حوّل ${money(D.total)} ريال`));
    c.append(el("p", "muted", "الفاتورة فوق حد الدفع عند الاستلام. حوّل قيمة المشتريات على الحساب هذا، وارفع صورة إيصال التحويل. التوصيل تدفعه عند الاستلام."));
    if(D.pay_info) c.append(el("div", "payinfo", D.pay_info));
    else c.append(el("p", "muted", "بيانات التحويل بتوصلك منّا على الواتساب."));
    const up = el("button", "btn", "📷 ارفع صورة إيصال التحويل"); up.onclick = () => pickFile();
    c.append(up); return c;
  }
  if(st === "prepay_check"){
    c.classList.remove("act");
    c.append(el("h2", "", "⏳ وصلنا إيصالك"), el("p", "muted", "نتأكد من التحويل، وبعدها المندوب يشتري طلبك."));
    const up = el("button", "btn line", "رفعت إيصال غلط؟ ارفع ثاني"); up.style.color = "var(--muted)"; up.onclick = () => pickFile(); c.append(up);
    return c;
  }
  c.classList.remove("act");
  if(st === "buying"){ c.append(el("h2", "", D.driver ? "🛍️ المندوب يشتري طلبك" : "🛍️ ننتظر مندوب يستلم طلبك")); return c; }
  if(st === "onway"){ c.append(el("h2", "", "🛵 المندوب في الطريق لك"), el("p", "muted", `جهّز ${money(D.collect)} ريال، وعطه رمز الاستلام بعد ما تستلم.`)); return c; }
  if(st === "delivered"){ c.append(el("h2", "", "✅ وصل طلبك، بالعافية")); return c; }
  if(st === "cancelled"){ c.append(el("h2", "", "الطلب ملغي"), el("p", "muted", "ما راح يندفع شي على هالطلب.")); return c; }
  return null;
}

async function send(body, done){
  if(busy) return; busy = true;
  document.querySelectorAll(".act .btn").forEach(b=>b.disabled = true);
  try{ await api(body); toast(done); }catch(err){ toast(err.message); }
  busy = false; load();
}
function pickFile(){ $("#file").value = ""; $("#file").click(); }
$("#file").addEventListener("change", async ()=>{
  const f = $("#file").files[0]; if(!f) return;
  try{ toast("جاري رفع الصورة…"); const image = await compress(f); await send({action:"prepay", image}, "وصل الإيصال ✓"); }
  catch(err){ toast(err.message); }
});

async function showImg(id){
  $("#imgvImg").src = "/api/track/" + encodeURIComponent(K) + "/images/" + id;
  $("#imgv").classList.remove("hidden");
}
$("#imgv").addEventListener("click", ()=>$("#imgv").classList.add("hidden"));

async function load(){
  if(!K){ $("#main").innerHTML = '<div class="card empty">الرابط ناقص. افتح الرابط اللي في رسالة طلبك.</div>'; return; }
  try{
    D = await api();
    if(lastStage && lastStage !== D.stage && D.stage === "approve" && navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch(e){}
    lastStage = D.stage;
    render();
  }catch(err){
    if(!D){ const m = $("#main"); m.innerHTML = ""; const e = el("div", "card empty"); e.append(el("b", "", err.status === 404 ? "ما لقينا طلبك للحين" : "ما قدرنا نجيب طلبك")); e.append(el("p", "muted", err.message)); m.append(e); }
  }
}
load();
setInterval(()=>{ if(document.visibilityState === "visible" && !busy && (!D || !["delivered","cancelled"].includes(D.stage))) load(); }, 15000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") load(); });
</script>
</body>
</html>
